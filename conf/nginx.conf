worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    error_log /dev/stderr warn;
    server_tokens off;

    # Arquivos grandes vão do disco direto para o socket, sem passar pela memória do Nginx.
    sendfile on;
    tcp_nopush on;

    keepalive_timeout 10;
    keepalive_requests 100;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # O site fica em http.d/default.conf. Para mudar o comportamento,
    # monte outro default.conf por cima (ConfigMap no Kubernetes).
    include /etc/nginx/http.d/*.conf;
}
