# Incluído dentro de cada bloco server: include /etc/nginx/snippets/common.conf;
#
# Atenção: um add_header dentro de um location anula estes. Se um site
# precisar de add_header num location, repita este include lá dentro.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Nunca serve arquivos ou pastas ocultos (.git, .env, .htpasswd...).
location ~ /\. {
    return 404;
}
