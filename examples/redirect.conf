# Redirect permanente para outro endereço, mantendo caminho e query string.
# Monte por cima de /etc/nginx/http.d/default.conf e troque o destino.
server {
    listen 8080 default_server;

    include /etc/nginx/snippets/common.conf;

    location / {
        return 301 https://example.com$request_uri;
    }
}
