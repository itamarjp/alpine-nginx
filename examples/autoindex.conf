# Site de arquivos com listagem de diretório.
# Monte por cima de /etc/nginx/http.d/default.conf.
server {
    listen 8080 default_server;
    root /var/www/html;
    index index.html;

    include /etc/nginx/snippets/common.conf;

    location / {
        autoindex on;
        autoindex_localtime on;
    }
}
